# skulhook.odysseyalive.com — JStack site config (HTTPS)
server {
    listen 80;
    server_name skulhook.odysseyalive.com;

    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name skulhook.odysseyalive.com;
    ssl_certificate /etc/letsencrypt/live/skulhook.odysseyalive.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skulhook.odysseyalive.com/privkey.pem;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP report-only (non-blocking; watchman 2026-06-19, finding 123). This vhost proxies the
    # Convex API/websocket backend (not an HTML UI), so CSP is minimal/low-value here.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;

    # watchman 2026-09-08 (#840): per-IP cap, sized ~7x above the measured
    # legitimate peak of 43 req/min. burst=50 nodelay absorbs a page load.
    # watchman 2026-09-08 (#868): resolve the upstream lazily at REQUEST time, not at
    # config-parse time. A parse-time hostname makes nginx fail to start whenever the
    # named container is not yet up - on 2026-09-08 that crash-looped nginx 9 times and
    # took EVERY vhost down for 57s during a docker daemon restart.
    # See PAT-2026-05-27-nginx-resolver-for-dynamic-upstreams.
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req zone=perip burst=50 nodelay;
    limit_conn conperip 20;

    location / {
set $upstream_skulhook http://odyssey-skul-convex-backend-1:3210;
        proxy_pass $upstream_skulhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
