# Default site config for JStack NGINX (workspace-managed)
server {
    # watchman 2026-09-08 (#840): explicit default_server. Without it the port-80
    # catch-all was decided by conf.d load order, which had drifted to
    # apps.odysseyalive.com.conf (alphabetically first) - the same class of bug as
    # #837 on 443. Bare-IP / unmatched-Host scans now land here, where they are
    # rate limited, instead of on an application vhost.
    listen 80 default_server;
    server_name _;
    
    # watchman 2026-09-08 (#840): the catch-all docroot is the single biggest scanner
    # target on this host (11987 of one sweep's 14696 404s landed here), so its
    # landing-page location gets the per-IP cap (see location / below).

    # ACME challenge location for Let's Encrypt
    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
    }

    # Serve landing page during setup
    location / {
        # Scoped to this location (NOT the server block) so the ACME challenge
        # location above never inherits it - LE validation must never be throttled.
        limit_req zone=perip burst=50 nodelay;
        limit_conn conperip 20;

        root /usr/share/nginx/default/html;
        index index.html;
    }
}


# watchman 2026-09-08 (#837): HTTPS catch-all. Without a 443 default_server, nginx
# answers unmatched/absent SNI from the first-loaded 443 block, which drifted to
# apps.odysseyalive.com and proxied bare-IP scans into the Next.js upstream (#846).
# 444 = close the connection with no response.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/odysseyalive.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odysseyalive.com/privkey.pem;

    return 444;
}
