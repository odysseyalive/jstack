# Odyssey Alive - Main Website

# HTTP server for ACME challenges and redirect
server {
    listen 80;
    server_name odysseyalive.com www.odysseyalive.com;

    # ACME challenge location for Let's Encrypt
    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Redirect www to non-www
server {
    listen 443 ssl;
    server_name www.odysseyalive.com;

    ssl_certificate /etc/letsencrypt/live/odysseyalive.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odysseyalive.com/privkey.pem;

    return 301 https://odysseyalive.com$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name odysseyalive.com;

    ssl_certificate /etc/letsencrypt/live/odysseyalive.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odysseyalive.com/privkey.pem;

    # Docker embedded DNS — forces nginx to re-resolve the upstream service
    # name at request time. See PAT-2026-05-27-nginx-resolver-for-dynamic-upstreams.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP report-only (non-blocking; watchman 2026-06-19, finding 117). Tune via browser
    # console violations, then promote to enforcing Content-Security-Policy. Includes
    # Cloudflare Turnstile origins (this site uses NEXT_PUBLIC_TURNSTILE_SITE_KEY).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Proxy to Next.js app
    # watchman 2026-09-08 (#848): production JS source maps were being harvested
    # (multiple networks fetched a6dad97d9634a72d.js.map). Refuse them at the proxy.
    location ~* \.map$ {
        access_log off;
        return 404;
    }

    # watchman 2026-09-08 (#840): per-IP cap, sized ~7x above the measured
    # legitimate peak of 43 req/min. burst=50 nodelay absorbs a page load.
    limit_req zone=perip burst=50 nodelay;
    limit_conn conperip 20;

    location / {
        set $upstream_odyssey http://odyssey-alive:3000;
        proxy_pass $upstream_odyssey;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (for HMR in dev, useful for Next.js)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
