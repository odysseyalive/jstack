# Docker keeps only a bounded buffer of each container's output (json-file, 3 x 10m);
# jstack copies it into sites/<site>/logs/<service>.log every 5 minutes
# (scripts/core/site_logs.sh). Every service carries `logging: *default-logging`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  lamp-app:
    logging: *default-logging
    build:
      context: .
      args:
        - DBUSER=${DBUSER:-mariadb_user}
        - DBPASS=${DBPASS:-secure_password}
    restart: unless-stopped
    ports:
      - "4002:80"
    volumes:
      - ./site-root/public_html:/var/www/html
    environment:
      - DOMAIN=${DOMAIN:-example.com}
      - DBUSER=${DBUSER:-mariadb_user}
      - DBPASS=${DBPASS:-secure_password}
