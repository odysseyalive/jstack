# Docker keeps only a bounded buffer of each container's output (json-file, 3 x 10m);
# jstack copies it into sites/<site>/logs/<service>.log every 5 minutes
# (scripts/core/site_logs.sh). Every service carries `logging: *default-logging`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  node-app:
    logging: *default-logging
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./site-root:/app
    working_dir: /app
    environment:
      - NODE_ENV=production
      - DOMAIN=${DOMAIN:-example.com}
      - PORT=4000
    command: ["npm", "start"]
