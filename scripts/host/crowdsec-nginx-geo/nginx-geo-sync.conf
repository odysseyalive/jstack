# watchman 2026-10-27: settings for /usr/local/sbin/crowdsec-nginx-geo-sync, which mirrors
# CrowdSec's local ban decisions into jstack nginx as layer-7 403s.
# Plan: /root/watchman/plan/crowdsec-nginx-enforcement-2026-10-27.md
[sync]
geo_file = /home/jarvis/jstack/nginx/conf.d/crowdsec-banned.geo
# Cloudflare ranges are read from here (set_real_ip_from) and never banned.
nginx_conf = /home/jarvis/jstack/nginx/nginx.conf

# Local decisions only. CAPI (community blocklist, ~18.7k IPs) is deliberately excluded.
origins = crowdsec cscli

# Decisions from these scenarios never block:
#  - 403-bf counts 403s, and nginx answers every banned IP with 403, so it would feed
#    on its own enforcement and escalate ban durations through profiles.yaml.
#  - crawl-non_statics is the scenario most likely to catch a fast human or a legit tool.
# An IP is still blocked if it holds any other decision.
skip_scenarios = LePresidente/http-generic-403-bf crowdsecurity/http-crawl-non_statics

# Never blocked, whatever CrowdSec decides (Cloudflare, private ranges and this host's own
# addresses are added automatically). <operator-ip> = operator admin IP (mywhitelists);
# 160.79.106.0/24 = Claude-User connector clients of y.odysseyalive.com.
allow = <operator-ip> 160.79.106.0/24
# One IP or CIDR per line, '#' comments allowed. Add here to stop someone being re-banned.
allow_file = /etc/crowdsec/nginx-geo-allow.txt

# Never write anything wider than these prefixes.
min_prefix_v4 = 24
min_prefix_v6 = 48

# Circuit breaker: a run that would add more entries than this at once is refused.
max_add = 200
