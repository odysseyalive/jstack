# watchman 2026-09-15 (#841): layer-7 ban for the containerized jstack nginx.
# Web traffic reaches this host from Cloudflare edge IPs, so nft/iptables bans on the
# real client IP never match a packet. nginx restores the client IP (realip) and
# checks it against a geo list; this action maintains that list and reloads nginx.
# Lines are tagged with the jail name so one jail's flush never removes another's bans.
# A failed reload never fails the ban: the entry is written and applies on the next
# successful reload or container start.

[Definition]

# watchman 2026-10-27: crowdsec-nginx-geo-sync also writes a list in conf.d and reloads
# nginx. Both writers hold this lock across edit + nginx -t + reload, so neither sees the
# other's half-written list or blames the other's failed test. fail2ban runs each action
# as one shell script, so fd 9 holds the lock until that script exits.
geo_lock = exec 9>>/run/jstack-nginx-geo.lock; flock -w 60 9 || true

geo_file = /home/jarvis/jstack/nginx/conf.d/f2b-banned.geo
# Find nginx by compose labels, not container name: compose v5 renamed jstack_nginx_1 to
# jstack-nginx-1 on recreate (2026-09-15), which silently broke a name-based exec.
nginx_reload = cid=$(docker ps -q --filter label=com.docker.compose.project=jstack --filter label=com.docker.compose.service=nginx | head -n1)
               ([ -n "$cid" ] && docker exec "$cid" nginx -t -q && docker exec "$cid" nginx -s reload) >/dev/null 2>&1 || true

actionstart = touch '%(geo_file)s'

actionstop = %(actionflush)s

actionflush = %(geo_lock)s
              sed -i -e '/ # <name>$/d' '%(geo_file)s'
              %(nginx_reload)s

actioncheck =

actionban = %(geo_lock)s
            echo '<ip> 1; # <name>' >> '%(geo_file)s'
            %(nginx_reload)s

actionunban = %(geo_lock)s
              sed -i -e '\|^<ip> 1; # <name>$|d' '%(geo_file)s'
              %(nginx_reload)s

[Init]
